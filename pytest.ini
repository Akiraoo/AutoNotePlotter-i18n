[pytest]
# 既定で並べて流す（pytest-xdist・配り方と働き手の数は tests/conftest.py）。1 本で流すのは -n 0
testpaths = tests
addopts = -n auto
required_plugins = pytest-xdist>=3.8
# 通ったテストの tmp_path はテストの後始末で消す（落ちたテストの物は残る）。全部残すと、終わりに 3 回前の一時フォルダ
# （全部の時 約 2,700 ファイル）を消すのに毎回 1.4 秒かかった。全部残したい時は -o tmp_path_retention_policy=all
tmp_path_retention_policy = failed
